# 布局原则：可写数据（.grok/presets/state）与打包前端必须在 asar 外（extraResources），
# 代码（electron/server/shared）进 asar；dist 同时保留在 asar 内只是冗余备份，运行时走 resources/app-dist。
appId: com.local.bunkiten
productName: Bunkiten # ASCII，规避 NSIS/非 UTF-8 终端对中文 productName 的兼容风险
# github provider：latest*.yml / app-update.yml 与 electron-updater 的前提（electron/main.js 打包态会查更新）。
# 实际发布由 .github/workflows/release.yml 的 release job 完成（打包时一律 --publish never），
# 这里只声明 update channel 的来源，避免 update-info 环节拿到 null channel 崩溃。
publish:
  provider: github
  owner: Jackela
  repo: bunkiten
# 公证钩子：electron-builder 的 afterSign 是**根级** hook（放在 mac: 下 schema 校验会失败），
# 钩子内部自行判断平台与三件套（APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID）；不齐则直接 return，
# 本地未签名构建（dist:mac / dist:mac:dir）与未配 secrets 的 CI 都照常成功。
afterSign: electron/notarize.cjs
directories:
  output: release
  buildResources: build # 应用图标等打包资源（build/icon.png ≥512，electron-builder 自动派生 .icns/.ico）
files:
  - dist/**
  - electron/**
  - server/**
  - shared/** # 协议常量真源 protocol.mjs（server/acp-server.mjs 经相对路径 import，缺了打包态起不来）
  - package.json
# MCP 出图 server 要被引擎拉成**子进程**，而子进程读不了 asar：它（以及它 import 的整棵树）必须
# 落在 asar 外的真实文件上，运行时路径由 server/media-mcp.mjs 的 mediaMcpPath() 把 `app.asar` 段
# 换成 `app.asar.unpacked`。
# 为什么是**两整棵树**而不是只解 media-mcp.mjs：MCP 从 unpacked 路径启动，它的相对 import
# （./config.mjs、./assets.mjs、./presets.mjs→./acp-server.mjs、./credentials.mjs、../shared/*.mjs）
# 全部按「导入者所在目录」解析——只解一个文件时那些兄弟都不在 unpacked 树里，子进程第一步就
# ERR_MODULE_NOT_FOUND（v1.10 实测抓到过）。枚举文件还会在下次改 import 时静默再坏，所以整棵解开；
# 代价只是十几个小 .mjs 在磁盘上多一份。
asarUnpack:
  - server/**
  - shared/**
extraResources:
  - from: .grok
    to: game/.grok
  - from: presets
    to: game/presets
  - from: state
    to: game/state
    filter: ["README.md"] # 只带说明文件，绝不打包本地进度
  - from: dist
    to: app-dist # acp-server 的 /app 托管目录
win:
  target:
    - nsis
    - portable
  # 刻意不写 signExecutable（默认 true），也绝不写 signAndEditExecutable: false —— 两条路都成立（v26.15.3 源码实证）：
  # - 没有证书 = 与「未签名」完全一致：WindowsSignToolManager.signFile() 在 cscInfo 为空且没有自定义 sign 钩子时
  #   只打一条 debug「no signing info identified, signing is skipped」就 return false（不抛错；forceCodeSigning
  #   默认 false 所以不会 fail），而 PE 资源编辑是**另一条**代码路径——signAndEditResources() 先
  #   editWindowsResources()（图标/版本串/执行级别）再 signIf()，未签名构建照样写资源；
  # - 有证书（WIN_CSC_LINK）= 真签：应用 exe、asar 外的 exe/dll、NSIS 安装器与卸载器（都走 packager.signIf()）
  #   一并签名，并默认带 RFC3161 时间戳（http://timestamp.digicert.com，无需配置）。
  # 为什么不再写 signExecutable: false（v1.6–v1.10 一直写着它）：那是**硬关**而不是「没证书就跳过」——
  # signIf() 见到它就 return false，证书配齐也不会签，等于把条件化的路堵死（upstream 文档只把它当作
  # 「想跳过签名但保留资源编辑」的手段，见 scheme 的 signAndEditExecutable 说明）。
  # 开启步骤、验收命令与本地不签名跑法：docs/RELEASING.md。
mac:
  target:
    - dmg
    - zip
  # 不再写死 identity: null —— 让 electron-builder 按 CSC_LINK / CSC_IDENTITY_AUTO_DISCOVERY 决定：
  # 本地与未配 secrets 的 CI 用 CSC_IDENTITY_AUTO_DISCOVERY=false 显式走未签名路径（dist:mac / dist:mac:dir）；
  # CI 里 CSC_LINK 存在时才自动发现证书并签名。arch 由 dist:mac 脚本 --arm64 --x64 传入。
  hardenedRuntime: true # 公证的前置条件
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
