name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # 单测与前端构建都不需要 Electron 二进制：跳过下载，CI 更快更稳
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # 最快的一对先跑（秒级、零依赖）：风格与静态规则。放在 build 之前是为了让最常见的
      # 「忘了跑 npm run format」在这里就断掉，不必等完构建与测试。
      - name: Format check（prettier --check）
        run: npm run format:check

      - name: Lint（oxlint：correctness 作 error + no-floating-promises / rules-of-hooks）
        run: npm run lint

      - name: Build（tsc -b && vite build）
        run: npm run build

      # server/shared/scripts 的 checkJs 门禁（tsconfig.server.json：strict + JSDoc 类型，
      # 独立于 src 的 tsconfig.json；tsc 已在 devDependencies，无新依赖）
      - name: Server typecheck（checkJs）
        run: npm run typecheck:server

      # tests/** 的类型门禁（tsconfig.tests.json，v1.13 补）：此前 tests/** 不在任何 tsconfig 里，
      # 最大的测试文件（ui.test.tsx 6000+ 行、contract.test.ts）里的类型错误静默存在——
      # esbuild 只剥类型不检查，编译器看不到它们。
      - name: Tests typecheck（tests/** 此前不在任何 tsconfig 里）
        run: npm run typecheck:tests

      # 单测 + 覆盖率（同一套测试文件，coverage provider 只是加仪表——替代原 `npm test` 步骤而非并列，
      # 避免 CI 双跑同一套测试拖 2 倍时长）。thresholds = 基线 - 2pp 的防下滑线（vitest.config.ts）。
      - name: Unit tests + coverage（parser/crafting/server/treeLayout/genealogy/diff/doctor/ui + 集成层）
        run: npm run test:coverage

      # 覆盖率 HTML 报告留档（测试红也要能看到差多少；if: always() 覆盖阈值未过的场景）
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/

      # UI e2e（npm run test:e2e:ui）走假引擎确定性栈（tests/e2e-ui/：假 ACP 引擎 + 真 acp-server
      # + vite dev，进程自起自停），不需要 grok 登录，可以进 CI；浏览器用默认 chromium，不依赖本机 Chrome。
      - name: Install Playwright chromium
        run: npx playwright install chromium --with-deps

      - name: UI e2e（假引擎确定性）
        run: npm run test:e2e:ui

      # 真引擎 e2e（npm run test:e2e）需要本机已登录的 grok CLI + 真引擎回合，只在开发机跑：
      #   npm run test:e2e

  # Windows 打包态冒烟（v1.12）：本机 macOS 交叉出不了 win 产物，而 win 产物此前**从没被真跑过**
  # ——「点开就能玩」在 Windows 上一直没有证据。这里在 win runner 上打一份 --dir 产物、再让打包态
  # e2e 真起一次 _electron（tests/e2e-packaged/，跨平台定位见 tests/helpers/packaged-app.mjs）。
  # 与 release.yml 的 win job 用同一个铺场脚本：产物架构自检、extraResources 与 asar 布局都走同一条路。
  packaged-win:
    runs-on: windows-latest
    env:
      # 打包态冒烟不联网查更新（main.js 认这个开关）；_electron 不需要浏览器下载
      BUNKITEN_DISABLE_UPDATE: "1"
      # 本 job 刚跑完 dist:win:dir，产物**必须**存在（v1.13）:此前 findPackagedApp 找不到产物时
      # 整组 test.skip → job 绿、零断言，「Windows 上的包能开」重新失去证据。
      BUNKITEN_REQUIRE_PACKAGED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # --dir 产物（release/win-unpacked/Bunkiten.exe）：不签名也不用 NSIS，跑冒烟足够了。
      # 纪律：`dist:win*` 这两条 npm script 必须保持**跨 shell**——Windows 的 cmd/pwsh 不认 POSIX 的
      # 内联环境变量前缀（`VAR=value cmd`），mac 专属的 `CSC_IDENTITY_AUTO_DISCOVERY=false` 只留在
      # dist:mac* 里（Windows 上本就没有证书自动发现这条路）。这条 job 是它第一次被真跑时抓到的。
      - name: Packaged dir build（stage-codex-acp --arch=x64 + electron-builder --win --dir）
        run: npm run dist:win:dir

      - name: Packaged smoke（打包布局 / asar / resources/game / codex-acp initialize）
        run: npm run test:e2e:packaged

