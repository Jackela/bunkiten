name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # 单测与前端构建都不需要 Electron 二进制：跳过下载，CI 更快更稳
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests（parser/crafting/server/treeLayout/ui）
        run: npm test

      - name: Build（tsc -b && vite build）
        run: npm run build

      # e2e（npm run test:e2e）需要本机已登录的 grok CLI + 真引擎回合，只在开发机跑：
      #   npm run test:e2e
